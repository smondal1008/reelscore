<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--seo-->
<title>Reelscore — Reviews for Indian movies and series</title>
<meta name="description" content="Verdicts, reviews and trailers for Bollywood and regional Indian films and series, with scores from people you follow.">
<meta property="og:site_name" content="Reelscore">
<meta property="og:type" content="website">
<meta property="og:title" content="Reelscore — Reviews for Indian movies and series">
<meta property="og:description" content="Verdicts, reviews and trailers for Bollywood and regional Indian films and series, with scores from people you follow.">
<meta name="twitter:card" content="summary">
<!--/seo-->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0B0A0F">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app/app.css">
<style>.authbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}.authbtn:hover{background:rgba(255,255,255,.1)}</style>
<script defer src="/firebase-config.js"></script>
<script defer src="/js/claude-shim.js"></script>
<script type="module" src="/js/firebase-adapter.js"></script>
</head>
<body class="r-home">

<header class="nav">
  <div class="links">
    <a class="brand" href="/"><span class="dot"></span>REELSCORE</a>
    <nav class="links" id="mainNav" aria-label="Main">
      <a class="lnk" href="/" data-r="home">Home</a>
      <a class="lnk" href="/browse" data-r="browse">Browse</a>
      <a class="lnk" href="/movies" data-r="movies">Movies</a>
      <a class="lnk" href="/tv-shows" data-r="tvshows">TV Shows</a>
      <a class="lnk" href="/trailers" data-r="vids" data-v="trailers">Trailers</a>
      <a class="lnk" href="/songs" data-r="vids" data-v="songs">Songs</a>
      <a class="lnk" href="/people" data-r="people">People</a>
      <!-- News comes back to the menu once there are enough stories; /news still works and is linked from the footer. -->
      <a class="lnk" href="/my-list" data-r="list">My List</a>
      <a class="lnk" data-r="admin" id="adminLink" hidden>Admin</a>
      <a class="lnk fbl" href="/contact" data-feedback="">Send feedback</a>
    </nav>
  </div>
  <div class="navr">
    <div class="sbox"><div class="search">
      <label for="sq" class="sicon" title="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B9B4C2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span class="sr">Search titles, cast</span></label>
      <input id="sq" type="search" placeholder="Search titles, cast" autocomplete="off">
    </div></div>
    <div class="results" id="results" hidden></div>
    <div class="me" id="meWrap" hidden>
      <button type="button" class="mebtn" id="meBtn" aria-haspopup="true" aria-expanded="false" aria-controls="meMenu" aria-label="Your account"><img class="avatar" id="meAvatar" alt="" hidden><span class="avatar meini" id="meIni" aria-hidden="true" hidden></span></button>
      <div class="memenu" id="meMenu" hidden>
        <div class="mename" id="meName"></div>
        <a href="/my-list">My List</a>
        <button type="button" data-feedback="">Send feedback</button>
        <button type="button" id="meOut">Sign out</button>
      </div>
    </div>
    <label class="sr" for="navCity">City</label>
    <select id="navCity" class="navsel" title="Your city, for ticket booking links"><option value="">City</option></select>
    <button type="button" class="menubtn" id="menuBtn" aria-expanded="false" aria-controls="mainNav" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </div>
</header>

<main id="content">
<div class="view" id="view-home"></div>
<div class="view" id="view-title"></div>
<div class="view" id="view-list"></div>
<div class="view" id="view-tonight"></div>
<div class="view" id="view-ottdates"></div>
<div class="view" id="view-browse"></div>
<div class="view" id="view-movies"></div>
<div class="view" id="view-tvshows"></div>
<div class="view" id="view-person"></div>
<div class="view" id="view-people"></div>
<div class="view" id="view-genre"></div>
<div class="view" id="view-year"></div>
<div class="view" id="view-vids"></div>
<div class="view" id="view-video"></div>
<div class="view" id="view-news"></div>
<div class="view" id="view-lists"></div>
<div class="view" id="view-about"></div>
<div class="view" id="view-privacy"></div>
<div class="view" id="view-contact"></div>

<div class="view" id="view-admin"><template id="adminTpl">
  <div class="ahead">
    <div class="ahead-l">
      <div class="display" role="heading" aria-level="1" style="font-size:30px">Admin</div>
      <nav class="atabs" aria-label="Admin sections">
        <a href="/admin/titles" data-g="titles">Titles <span class="cnt" id="titleCount"></span></a>
        <a href="/admin/people" data-g="people">People</a>
        <a href="/admin/home-banner" data-g="home">Home page</a>
        <a href="/admin/news" data-g="writing">Writing <span class="cnt" id="writeCount"></span></a>
        <a href="/admin/messages" data-g="messages">Messages <span class="cnt" id="msgCount"></span></a>
      </nav>
    </div>
    <div class="status" id="status" role="status">Connecting…</div>
    <nav class="asub" id="asub" aria-label="Pages in this section">
      <div class="asubg" data-g="titles" hidden>
        <a href="/admin/titles" data-p="titles">All titles</a>
        <a href="/admin/ott-dates" data-p="ottdates">OTT dates <span class="cnt" id="ottCount"></span></a>
      </div>
      <div class="asubg" data-g="people" hidden>
        <a href="/admin/people" data-p="people">Cast &amp; crew <span class="cnt" id="peopleCount"></span></a>
        <a href="/admin/popular" data-p="popular">Popular cast <span class="cnt" id="popCount"></span></a>
      </div>
      <div class="asubg" data-g="home" hidden>
        <a href="/admin/home-banner" data-p="banner">Home banner <span class="cnt" id="featCount"></span></a>
        <a href="/admin/movies-banner" data-p="moviesbanner">Movies banner <span class="cnt" id="movFeatCount"></span></a>
        <a href="/admin/tv-banner" data-p="tvbanner">TV Shows banner <span class="cnt" id="tvFeatCount"></span></a>
        <a href="/admin/home-rows" data-p="rows">Home rows <span class="cnt" id="rowsCount"></span></a>
        <a href="/admin/buttons" data-p="buttons">Buttons <span class="cnt" id="btnCount"></span></a>
      </div>
      <div class="asubg" data-g="writing" hidden>
        <a href="/admin/news" data-p="news">News <span class="cnt" id="newsCount"></span></a>
        <a href="/admin/blog" data-p="blog">Blog <span class="cnt" id="blogCount"></span></a>
        <a href="/admin/lists" data-p="lists">Lists <span class="cnt" id="listsCount"></span></a>
      </div>
    </nav>
  </div>
  <div class="apage" id="titlesPage" hidden>
    <div class="ttools">
      <div class="search" style="flex:1 1 260px;max-width:460px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B9B4C2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <label for="q" class="sr">Search titles</label>
        <input id="q" type="search" placeholder="Search title, director, cast" autocomplete="off">
      </div>
      <label class="sr" for="typeSel">Movies or TV shows</label>
      <select id="typeSel" class="in tsel"></select>
      <label class="sr" for="langSel">Language</label>
      <select id="langSel" class="in tsel"></select>
      <label class="sr" for="yearSel">Release year</label>
      <select id="yearSel" class="in tsel"></select>
      <label class="sr" for="seoSel">SEO status</label>
      <select id="seoSel" class="in tsel"></select>
      <label class="sr" for="starSel">Star power</label>
      <select id="starSel" class="in tsel"></select>
      <label class="sr" for="statusSel">Status</label>
      <select id="statusSel" class="in tsel"></select>
      <label class="sr" for="sortSel">Sort by</label>
      <select id="sortSel" class="in tsel"></select>
      <span style="flex:1"></span>
      <a class="btn primary" id="addBtn" href="/admin/titles/new">+ Add title</a>
    </div>
    <div class="ottq" id="ottQueue"></div>
    <div class="chips" role="group" aria-label="Filter by section" id="filters"></div>
    <div class="tsum" id="tsum" aria-live="polite"></div>
    <div class="ttable-wrap"><table class="ttable" id="list"></table></div>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
  </div>
  <div class="apage" id="editPage" hidden>
    <div class="main" id="main"><div class="empty">Loading…</div></div>
  </div>
  <div class="savebar" id="savebar" hidden>
    <div class="msg" id="saveMsg"></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button type="button" class="btn ghost" id="discardBtn">Discard changes</button>
      <button type="button" class="btn primary" id="saveBtn">Save changes</button>
    </div>
  </div>
</template></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script defer src="/app/about.js"></script>
<script defer src="/app/main.js"></script>
</body>
</html>
