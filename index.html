<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reelscore — Reviews for Indian movies and series</title>
<meta name="description" content="Verdicts, reviews and trailers for Bollywood and regional Indian films and series, with scores from people you follow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #0B0A0F; --panel: #15131B; --panel2: #1C1A23; --line: #2A2633; --line2: #3A3545;
    --text: #F4F1EA; --muted: #B9B4C2; --dim: #8E8899; --accent: #F5A524; --danger: #F0776B; --ok: #8FD6A8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 15px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 16px 28px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-family: Anton, Impact, sans-serif; font-size: 24px; letter-spacing: .5px; }
  .brand .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
  .brand small { font-family: Inter, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .8px; color: var(--muted); padding: 4px 8px; border: 1px solid var(--line2); border-radius: 4px; }
  .status { font-size: 13px; color: var(--muted); }
  .wrap { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; padding: 24px 28px 120px; }
  .side { flex: 1 1 320px; max-width: 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .main { flex: 999 1 560px; min-width: 0; }
  .search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 22px; background: var(--panel2); border: 1px solid var(--line2); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line2); background: var(--panel2); font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0B0A0F; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid var(--line2); background: var(--panel2); font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0B0A0F; font-weight: 700; }
  .btn.primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: transparent; }
  .btn.danger { background: transparent; border-color: #5A2A2A; color: var(--danger); }
  .btn.small { height: 36px; padding: 0 12px; font-size: 13px; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; border-radius: 12px; border: 1px solid transparent; background: transparent; text-align: left; cursor: pointer; }
  .item:hover { background: var(--panel); }
  .item[aria-current="true"] { background: var(--panel); border-color: var(--accent); }
  .thumb { flex: 0 0 auto; width: 44px; height: 66px; border-radius: 6px; background: #2E2A38 center / cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--dim); }
  .item .t { font-size: 14px; font-weight: 600; }
  .item .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .bar { height: 4px; border-radius: 2px; background: var(--line2); margin-top: 6px; overflow: hidden; width: 140px; max-width: 100%; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .group-h { font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--dim); margin: 10px 8px 2px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .card + .card { margin-top: 16px; }
  .card h2 { margin: 0; font-size: 18px; }
  .card h3 { margin: 0; font-size: 15px; }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .head h1 { margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 40px; line-height: 1; text-transform: uppercase; }
  .sub { font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  label.l { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .miss { font-size: 10px; font-weight: 700; letter-spacing: .5px; padding: 2px 6px; border-radius: 4px; background: #3D2A12; color: #F5C46B; }
  input.in, select.in, textarea.in { width: 100%; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg); outline: none; font-size: 14px; }
  textarea.in { height: auto; min-height: 96px; padding: 10px 12px; line-height: 1.5; resize: vertical; }
  .in:focus { border-color: var(--accent); }
  .images { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 18px; }
  @media (max-width: 720px) { .images { grid-template-columns: 1fr; } .wrap { padding: 16px 16px 120px; } .top { padding: 14px 16px; } }
  .drop { position: relative; border: 1.5px dashed var(--line2); border-radius: 12px; background: var(--bg) center / cover no-repeat; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 12px; color: var(--muted); font-size: 13px; }
  .drop.poster { aspect-ratio: 2 / 3; }
  .drop.banner { aspect-ratio: 16 / 9; }
  .drop.has { border-style: solid; border-color: var(--line); }
  .drop.over { border-color: var(--accent); background-color: #1F1A10; }
  .drop .acts { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .drop.has .hint { display: none; }
  .note { font-size: 12px; color: var(--dim); }
  .warn { font-size: 12px; color: #F5C46B; }
  .err { font-size: 13px; color: var(--danger); }
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
  .row.cast { grid-template-columns: 48px minmax(0, 1.2fr) minmax(0, 1fr) 44px; }
  .pav { width: 44px; height: 44px; border-radius: 50%; border: 1px dashed var(--line2); background: var(--panel2) center / cover no-repeat; color: var(--dim); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .pav.has { border: 2px solid var(--line2); color: transparent; }
  .pav:hover { border-color: var(--accent); }
  .row.v { grid-template-columns: 130px minmax(0, 1fr) minmax(0, 1.4fr) 44px; }
  @media (max-width: 720px) { .row.v { grid-template-columns: 1fr 1fr; } }
  .x { width: 44px; height: 42px; border-radius: 10px; border: 1px solid var(--line2); background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; }
  .x:hover { color: var(--danger); border-color: #5A2A2A; }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 28px; background: rgba(21,19,27,.96); border-top: 1px solid var(--line); z-index: 5; }
  .savebar .msg { font-size: 14px; color: var(--muted); }
  .savebar .msg b { color: var(--text); }
  .empty { padding: 40px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 16px; }
  .banner-note { padding: 12px 16px; border-radius: 12px; background: #2A2112; border: 1px solid #5A4520; color: #F5D9A0; font-size: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .preview { position: relative; border-radius: 14px; overflow: hidden; background: #241C3A; min-height: 220px; display: flex; align-items: flex-end; }
  .preview .bg { position: absolute; inset: 0; background: center / cover no-repeat; }
  .preview .fade { position: absolute; inset: 0; background: linear-gradient(to right, rgba(11,10,15,.92) 25%, rgba(11,10,15,.2)); }
  .preview .in2 { position: relative; display: flex; gap: 18px; align-items: flex-end; padding: 18px; }
  .preview .pp { width: 92px; aspect-ratio: 2/3; border-radius: 8px; background: #3A2C63 center / cover no-repeat; flex: 0 0 auto; border: 1px solid rgba(244,241,234,.15); }
  .preview .tt { font-family: Anton, Impact, sans-serif; font-size: 34px; line-height: 1; text-transform: uppercase; }

  /* ---------- site ---------- */
  .nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 28px; padding: 14px 40px; border-bottom: 1px solid var(--line); position: relative; z-index: 4; }
  .nav .links { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 26px; }
  .nav a.lnk { color: var(--muted); text-decoration: none; font-size: 15px; font-weight: 500; padding: 8px 0; border-bottom: 2px solid transparent; }
  .nav a.lnk[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }
  .nav a.brand { color: var(--text); text-decoration: none; }
  .navr { display: flex; align-items: center; gap: 12px; position: relative; }
  .results { position: absolute; top: 52px; right: 0; width: min(380px, 90vw); background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .results a { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; color: var(--text); text-decoration: none; }
  .results a:hover, .results a:focus { background: var(--panel2); outline: none; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; background: var(--panel2); }
  .view { display: none; }
  body.r-home #view-home, body.r-title #view-title, body.r-list #view-list, body.r-browse #view-browse, body.r-admin #view-admin { display: block; }
  body:not(.r-admin) #savebar { display: none !important; }
  .nav { background: linear-gradient(to bottom, #1a0f10, var(--bg)); border-bottom: 0; padding-top: 18px; padding-bottom: 18px; }
  .nav a.lnk { padding: 10px 18px; border-radius: 22px; border-bottom: 0; color: #D9D5DF; }
  .nav a.lnk:hover { color: var(--text); }
  .nav a.lnk[aria-current="page"] { background: rgba(244,241,234,.14); color: var(--text); border-bottom: 0; font-weight: 600; }
  .fh { position: relative; margin: 8px 40px 0; border-radius: 22px; overflow: hidden; aspect-ratio: 2.2 / 1; min-height: 480px; max-height: 760px; background-color: #1a1418; background-size: cover; background-position: center right; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .fh .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,8,10,.92) 0%, rgba(10,8,10,.72) 28%, rgba(10,8,10,.25) 55%, rgba(10,8,10,0) 72%), linear-gradient(to top, rgba(10,8,10,.75) 0%, rgba(10,8,10,0) 40%); }
  .fh .fb { position: absolute; left: 0; bottom: 0; width: min(620px, 92%); padding: 0 0 56px 64px; display: flex; flex-direction: column; gap: 18px; }
  .fh .logo { margin: 0; font-family: Cinzel, Georgia, serif; font-weight: 800; font-size: clamp(44px, 6.4vw, 104px); line-height: .95; letter-spacing: 1px; color: #F3EBDD; text-shadow: 0 4px 24px rgba(0,0,0,.55); }
  .fh .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 18px; font-weight: 600; color: var(--text); }
  .fh .meta i { width: 5px; height: 5px; border-radius: 50%; background: #8E8899; display: inline-block; }
  .fh .meta .cert { font-weight: 500; color: #D9D5DF; }
  .fh .syn { margin: 0; font-size: 19px; line-height: 1.5; color: #EDE8F0; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .fh .btns { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 30px; border-radius: 28px; font-size: 19px; font-weight: 700; text-decoration: none; border: 0; cursor: pointer; }
  .pill.play { background: #fff; color: #0B0A0F; }
  .pill.play:hover { background: #e6e6e6; }
  .pill.info { background: rgba(109,109,110,.7); color: #fff; font-weight: 600; }
  .pill.info:hover { background: rgba(109,109,110,.5); }
  .roundadd { width: 52px; height: 52px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); background: rgba(10,8,10,.4); color: #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .roundadd[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0B0A0F; font-size: 20px; font-weight: 800; }
  .fh .chipsr { position: absolute; right: 56px; bottom: 56px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; max-width: 46%; }
  .fh .hc { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; background: rgba(20,16,20,.72); backdrop-filter: blur(6px); font-size: 16px; font-weight: 600; color: var(--text); }
  .fh .hc b { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 5px; border-radius: 5px; background: var(--accent); color: #0B0A0F; font-size: 12px; font-weight: 800; }
  .fh video.fv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .fh.playing .scrim { background: linear-gradient(90deg, rgba(10,8,10,.7) 0%, rgba(10,8,10,.25) 30%, rgba(10,8,10,0) 50%), linear-gradient(to top, rgba(10,8,10,.7) 0%, rgba(10,8,10,0) 35%); }
  .fh.playing .syn, .fh.playing .meta, .fh.playing .chipsr, .fh.playing .fdots { display: none; }
  .fh.playing .logo { font-size: clamp(30px, 3.6vw, 56px); }
  .fh .logo, .fh .scrim { transition: font-size .4s ease, background .4s ease; }
  .tp video.fv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .tp.playing { min-height: min(72vh, 680px); display: flex; align-items: flex-end; }
  .tp.playing .in { width: 100%; }
  .tp.playing .shade { background: linear-gradient(90deg, rgba(10,8,10,.75) 0%, rgba(10,8,10,.2) 35%, rgba(10,8,10,0) 55%), linear-gradient(to top, rgba(10,8,10,.8) 0%, rgba(10,8,10,0) 40%); }
  .tp.playing .poster, .tp.playing .lede, .tp.playing .tags, .tp.playing .sbt { display: none; }
  .tp.playing .ttl { font-size: clamp(30px, 3.6vw, 52px) !important; }
  .vclose { position: absolute; right: 20px; top: 20px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); background: rgba(10,8,10,.55); color: #fff; font-size: 22px; cursor: pointer; z-index: 3; }
  .vprog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.2); z-index: 3; }
  .vprog span { display: block; height: 100%; width: 0; background: var(--accent); }
  .fh .fdots { position: absolute; left: 64px; bottom: 22px; display: flex; gap: 6px; }
  .fh .fdots button { width: 32px; height: 20px; border: 0; background: transparent; cursor: pointer; padding: 0; display: flex; align-items: center; }
  .fh .fdots span { display: block; height: 4px; width: 100%; border-radius: 2px; background: rgba(255,255,255,.3); }
  .fh .fdots button[aria-current="true"] span { background: #fff; }
  @media (max-width: 900px) {
    .fh { aspect-ratio: auto; min-height: 560px; margin: 8px 16px 0; background-position: 70% center; }
    .fh .scrim { background: linear-gradient(to top, rgba(10,8,10,.95) 0%, rgba(10,8,10,.7) 45%, rgba(10,8,10,.1) 80%); }
    .fh .fb { padding: 0 22px 64px; width: 100%; }
    .fh .chipsr { position: static; justify-content: flex-start; max-width: none; }
    .fh .fdots { left: 22px; }
    .fh .meta { font-size: 15px; } .fh .syn { font-size: 16px; } .pill { height: 48px; padding: 0 22px; font-size: 16px; }
  }
  .hero { position: relative; margin: 20px 40px 0; border-radius: 18px; overflow: hidden; min-height: 520px; display: flex; align-items: flex-end; }
  .art { background-color: #241C3A; background-size: cover; background-position: center; }
  .hero .shade, .tp .shade { position: absolute; inset: 0; background: linear-gradient(to right, rgba(11,10,15,.94) 28%, rgba(11,10,15,.35) 70%, rgba(11,10,15,.1)), linear-gradient(to top, rgba(11,10,15,.9), rgba(11,10,15,0) 55%); }
  .hero .body { position: relative; padding: 48px 56px; max-width: 680px; display: flex; flex-direction: column; gap: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { padding: 6px 10px; border-radius: 4px; background: rgba(244,241,234,.14); font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
  .tag.hot { background: var(--accent); color: #0B0A0F; }
  .display { margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; line-height: .95; letter-spacing: .5px; text-transform: uppercase; }
  .lede { margin: 0; font-size: 17px; line-height: 1.55; color: #D9D5DF; }
  .acts2 { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn.light { background: var(--text); border-color: var(--text); color: #0B0A0F; font-weight: 700; }
  .btn.lg { height: 50px; padding: 0 22px; font-size: 15px; border-radius: 25px; }
  .btn.glass { background: rgba(11,10,15,.45); border-color: rgba(244,241,234,.4); }
  .arrow { position: absolute; top: 50%; margin-top: -24px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(244,241,234,.35); background: rgba(11,10,15,.55); color: var(--text); cursor: pointer; font-size: 22px; z-index: 2; }
  .dots { display: flex; justify-content: center; gap: 4px; margin-top: 12px; }
  .dots button { width: 40px; height: 24px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .dots span { height: 4px; border-radius: 2px; background: #4A4555; width: 12px; }
  .dots button[aria-current="true"] span { width: 32px; background: var(--accent); }
  .sect { margin-top: 44px; }
  .sect-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; padding: 0 40px; margin-bottom: 14px; }
  .sect-h h2 { margin: 0; font-size: 24px; }
  .sect-h .sub a { color: var(--muted); }
  .rowx { display: flex; gap: 18px; overflow-x: auto; padding: 0 40px 10px; scroll-snap-type: x proximity; }
  .pc { flex: 0 0 auto; width: 200px; display: flex; flex-direction: column; gap: 8px; scroll-snap-align: start; }
  .pc a.pa { position: relative; display: block; aspect-ratio: 2/3; border-radius: 14px; overflow: hidden; color: var(--text); text-decoration: none; }
  .pc a.pa:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .pc .ptitle { position: absolute; left: 12px; right: 12px; bottom: 12px; font-family: Anton, Impact, sans-serif; font-size: 26px; line-height: 1.02; text-transform: uppercase; }
  .pc .pfade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,10,15,.92), rgba(11,10,15,0) 60%); }
  .pc.img .pfade, .pc.img .ptitle { display: none; }
  .badge { position: absolute; left: 10px; top: 10px; padding: 5px 8px; border-radius: 6px; background: rgba(11,10,15,.88); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .datebadge { position: absolute; left: 10px; top: 10px; width: 54px; padding: 6px 0; border-radius: 8px; background: rgba(11,10,15,.9); display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .datebadge b { font-family: Anton, Impact, sans-serif; font-size: 22px; font-weight: 400; }
  .datebadge small { margin-top: 3px; font-size: 11px; font-weight: 700; letter-spacing: .8px; color: var(--accent); }
  .pw { position: relative; }
  .addl { position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(244,241,234,.45); background: rgba(11,10,15,.72); color: var(--text); font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; transition: transform .12s ease, background .12s ease; }
  .addl:hover { transform: scale(1.08); background: rgba(11,10,15,.9); }
  .addl[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0B0A0F; font-size: 18px; font-weight: 800; }
  .addl:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .plat { position: absolute; right: 10px; top: 56px; padding: 4px 8px; border-radius: 4px; background: rgba(11,10,15,.88); font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
  .pc .nm { font-size: 15px; font-weight: 600; color: var(--text); text-decoration: none; }
  .pc .mt { font-size: 13px; color: var(--muted); }
