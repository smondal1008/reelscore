<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--seo-->
<title>Reelscore — Reviews for Indian movies and series</title>
<meta name="description" content="Verdicts, reviews and trailers for Bollywood and regional Indian films and series, with scores from people you follow.">
<meta property="og:site_name" content="Reelscore">
<meta property="og:type" content="website">
<meta property="og:title" content="Reelscore — Reviews for Indian movies and series">
<meta property="og:description" content="Verdicts, reviews and trailers for Bollywood and regional Indian films and series, with scores from people you follow.">
<meta name="twitter:card" content="summary">
<!--/seo-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/app.css">
<style>.authbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}.authbtn:hover{background:rgba(255,255,255,.1)}</style>
<script src="/firebase-config.js"></script>
<script src="/js/claude-shim.js"></script>
<script type="module" src="/js/firebase-adapter.js"></script>
</head>
<body class="r-home">

<header class="nav">
  <div class="links">
    <a class="brand" href="/"><span class="dot"></span>REELSCORE</a>
    <nav class="links" aria-label="Main">
      <a class="lnk" href="/" data-r="home">Home</a>
      <a class="lnk" href="/browse" data-r="browse">Browse</a>
      <a class="lnk" href="/people" data-r="people">People</a>
      <a class="lnk" href="/my-list" data-r="list">My List</a>
      <label class="sr" for="navLang">Language</label>
      <select id="navLang" class="navsel" title="Show titles in this language"><option value="">All languages</option></select>
      <a class="lnk" data-r="admin" id="adminLink" hidden>Admin</a>
    </nav>
  </div>
  <div class="navr">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B9B4C2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="sq" class="sr">Search movies and series</label>
      <input id="sq" type="search" placeholder="Search titles, cast" autocomplete="off" style="width:200px">
    </div>
    <div class="results" id="results" hidden></div>
    <img class="avatar" id="meAvatar" alt="" hidden>
  </div>
</header>

<div class="view" id="view-home"></div>
<div class="view" id="view-title"></div>
<div class="view" id="view-list"></div>
<div class="view" id="view-browse"></div>
<div class="view" id="view-person"></div>
<div class="view" id="view-people"></div>
<div class="view" id="view-genre"></div>
<div class="view" id="view-year"></div>
<div class="view" id="view-vids"></div>

<div class="view" id="view-admin"><template id="adminTpl">
  <div class="ahead">
    <div class="ahead-l">
      <h1 class="display" style="font-size:30px">Admin</h1>
      <nav class="atabs" aria-label="Admin sections">
        <a href="/admin/titles" data-p="titles">All titles <span class="cnt" id="titleCount"></span></a>
        <a href="/admin/people" data-p="people">Cast &amp; crew <span class="cnt" id="peopleCount"></span></a>
        <a href="/admin/popular" data-p="popular">Popular cast <span class="cnt" id="popCount"></span></a>
        <a href="/admin/home-banner" data-p="banner">Home banner <span class="cnt" id="featCount"></span></a>
      </nav>
    </div>
    <div class="status" id="status" role="status">Connecting…</div>
  </div>
  <div class="apage" id="titlesPage" hidden>
    <div class="ttools">
      <div class="search" style="flex:1 1 260px;max-width:460px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B9B4C2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <label for="q" class="sr">Search titles</label>
        <input id="q" type="search" placeholder="Search title, director, cast" autocomplete="off">
      </div>
      <label class="sr" for="langSel">Language</label>
      <select id="langSel" class="in tsel"></select>
      <label class="sr" for="sortSel">Sort by</label>
      <select id="sortSel" class="in tsel"></select>
      <span style="flex:1"></span>
      <a class="btn primary" id="addBtn" href="/admin/titles/new">+ Add title</a>
    </div>
    <div class="chips" role="group" aria-label="Filter by section" id="filters"></div>
    <div class="tsum" id="tsum" aria-live="polite"></div>
    <div class="ttable-wrap"><table class="ttable" id="list"></table></div>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
  </div>
  <div class="apage" id="editPage" hidden>
    <main class="main" id="main"><div class="empty">Loading…</div></main>
  </div>
  <div class="savebar" id="savebar" hidden>
    <div class="msg" id="saveMsg"></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button type="button" class="btn ghost" id="discardBtn">Discard changes</button>
      <button type="button" class="btn primary" id="saveBtn">Save changes</button>
    </div>
  </div>
</template></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/app/main.js"></script>
</body>
</html>
